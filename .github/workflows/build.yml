name: Build Phone Remote

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build the phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: phone-app
          path: PhoneRemote.apk

  pc:
    name: Build the PC program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build the Windows program
        working-directory: pc
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags "-H=windowsgui -s -w -X main.version=1.0.${{ github.run_number }}" -o ../PhoneRemote-PC.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: pc-program
          path: PhoneRemote-PC.exe

  publish:
    name: Put both on the latest download page
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Write the version number
        run: echo "${{ github.run_number }}" > out/version.txt

      - name: Publish to the "latest" release (fixed download links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Phone Remote (latest build)
          files: |
            out/PhoneRemote.apk
            out/PhoneRemote-PC.exe
            out/version.txt
